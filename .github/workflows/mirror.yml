name: Mirror upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync branches via merge-upstream API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=$(git ls-remote --heads https://github.com/aimod-cc/Agent2API.git | awk '{print $2}' | sed 's#^refs/heads/##' | grep -v '^mirror-control$')
          for b in $branches; do
            echo "== syncing $b =="
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/merge-upstream" \
              -d "{\"branch\":\"${b}\"}")
            cat /tmp/resp.json
            echo
            if [ "$code" != "200" ]; then
              echo "merge-upstream failed for $b: HTTP $code"
              exit 1
            fi
          done

      - name: Sync tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/aimod-cc/Agent2API.git upstream.git
          cd upstream.git
          git config --unset remote.origin.mirror || true
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force --prune origin "refs/tags/*:refs/tags/*"
          echo "---- mirrored tags ----"
          git for-each-ref --format='%(refname) %(objectname:short)' refs/tags
