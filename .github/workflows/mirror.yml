name: Mirror upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mirror branches, keeping fork workflow files frozen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone https://github.com/aimod-cc/Agent2API.git upstream
          cd upstream
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          for b in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#^refs/heads/##'); do
            echo "== syncing $b =="
            git checkout -B "sync/${b}" "origin/${b}"

            if git fetch fork "+refs/heads/${b}:refs/remotes/fork/${b}" 2>/dev/null; then
              # 保留 fork 现有的 workflow 文件，避免 push 触发 workflows 权限限制
              git checkout "fork/${b}" -- .github/workflows 2>/dev/null || {
                git rm -r --cached .github/workflows 2>/dev/null || true
                rm -rf .github/workflows
              }
            else
              git rm -r --cached .github/workflows 2>/dev/null || true
              rm -rf .github/workflows
            fi
            git add -A

            if git diff --quiet "fork/${b}" -- . 2>/dev/null; then
              echo "$b: no changes"
              continue
            fi

            git commit -m "mirror: sync ${b} from upstream"
            git push --force fork "sync/${b}:refs/heads/${b}"
          done

      - name: Sync tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/aimod-cc/Agent2API.git tags.git
          cd tags.git
          git config --unset remote.origin.mirror || true
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push --force --prune origin "refs/tags/*:refs/tags/*"
          echo "---- mirrored tags ----"
          git for-each-ref --format='%(refname) %(objectname:short)' refs/tags
